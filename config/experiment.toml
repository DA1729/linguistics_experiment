[experiment]
name = "multilingual_translation_v1"
seed = 20261011
selection_seed = 1729
language_count = 50
# Optional explicit NLLB codes; when set, overrides language_count.
languages = []

[model]
name = "facebook/nllb-200-distilled-600M"
revision = "f8d333a098d19b4fd9a8b18f94170487ad3f821d"
precision = "float32"
batch_size = 32
max_input_tokens = 512
max_new_tokens = 256
max_batch_seconds = 90.0

[dataset]
local_file = ""
local_license = "user_supplied; consult corpus owner"

[runtime]
max_hours = 18.0
# Illustrative assumption, NOT a live RunPod quote. Set to your Pod's hourly price.
gpu_hourly_usd = 0.30
progress_seconds = 30.0

[smoke]
sentences = 4
rounds = 2
repetitions = 1
observe_every = 1
observation_rounds = []

[pilot]
sentences = 100
rounds = 30
repetitions = 1
observe_every = 1
observation_rounds = []

[main]
sentences = 1000
rounds = 100
repetitions = 1
observe_every = 5
observation_rounds = [0, 1, 2, 3, 5, 10, 15]
